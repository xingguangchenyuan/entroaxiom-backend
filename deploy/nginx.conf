# /etc/nginx/conf.d/entroaxiom.conf
#
# 拓扑（与后端 PUBLIC_ORIGIN / ALLOWED_ORIGINS 对应）：
#   https://entroaxiom.com        → /srv/entroaxiom/site   （前台，站点根路径）
#   https://admin.entroaxiom.com  → /srv/entroaxiom/admin  （后台，独立子域名，根路径）
#   两个域名的 /api/            → 同一个 127.0.0.1:8000（Node / Fastify）
#   /srv/entroaxiom/shared/uploads/{public,private} 是 UPLOAD_ROOT
#
# Cookie 是 host-only 的（后端不设 Domain），所以前台与后台各自持有自己的 sid，
# 这也是必须用同一后端的原因：两个域名下的会话互不干扰，但数据是同一份。
#
# 证书默认用一张多 SAN 证书（entroaxiom.com + www + admin.entroaxiom.com），
# 三个 server 块共用 /etc/letsencrypt/live/entroaxiom.com/。若给子域单独签发，
# 把对应块的 ssl_certificate 换成 /etc/letsencrypt/live/<域名>/ 即可。
# 子路径部署（https://entroaxiom.com/admin/）仍可用：把 admin 的 server 块换回
#   location /admin/ { root /srv/entroaxiom; try_files $uri $uri/ /admin/index.html; }
# 并改用 `pnpm build:admin`；本文件默认给的是独立子域名方案（`pnpm build:admin:subdomain`）。

upstream entroaxiom_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---------------------------------------------------------------- 前台
# www 与主域共用一个 80 端口 server：ACME HTTP-01 走 webroot，其余 301 到主域。
# Cloudflare 开代理（橙云）时 /.well-known/acme-challenge/ 仍会透传到源站，
# 因此 certbot 用 --webroot -w /var/www/html 就能续期，不需要 DNS 插件。
server {
    listen 80;
    listen [::]:80;
    server_name entroaxiom.com www.entroaxiom.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://entroaxiom.com$request_uri; }
}

# www → 主域（证书是同一张，SAN 里含 www）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.entroaxiom.com;
    ssl_certificate     /etc/letsencrypt/live/entroaxiom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entroaxiom.com/privkey.pem;
    return 301 https://entroaxiom.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name entroaxiom.com;

    ssl_certificate     /etc/letsencrypt/live/entroaxiom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entroaxiom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    root /srv/entroaxiom/site;
    index index.html;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # 带 hash 的静态资源可以放心长缓存；index.html 必须每次回源，否则发版后
    # 用户手里还是旧 index，会去请求已经被删掉的 /assets/xxx.js 而白屏。
    # 注意：location 里一旦写了 add_header 就不再继承 server 级的，所以安全头要重写一遍。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # 1) API 反代：必须传真实来源与真实 IP，后端靠它们做 Origin 校验与限流
    location /api/ {
        proxy_pass http://entroaxiom_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 180s;   # 导入预览允许 180s
        proxy_send_timeout 180s;
        proxy_buffering off;       # 导入/导出流式响应
        # 绝不在此处 add_header Access-Control-Allow-Origin *
    }

    # 2) 公开上传目录：只读静态，禁止列目录；文件名由服务端生成
    # 历史 SVG 直访阻断：旧上传目录里可能还留着 .svg/.svgz，
    # 直接静态提供会被浏览器当成同源文档执行脚本，nosniff 不足以防住。
    # 正则 location 优先级高于前缀 location；只匹配 /uploads/ 下，不影响站点根 favicon.svg。
    location ~* ^/uploads/(public|private)/.+\.svgz?$ {
        return 404;
    }

    location /uploads/public/ {
        alias /srv/entroaxiom/shared/uploads/public/;
        autoindex off;
        access_log off;
        # 公开文件的 URL 不随可见性变化：缓存太久的话，改成私密之后
        # 浏览器/CDN 里仍会留着副本。这里只给 5 分钟且不加 immutable，
        # 撤回后最迟一个 TTL 消失；要立即生效得靠版本化 URL + CDN purge。
        # location 里出现 add_header 就不再继承上层，nosniff 必须在这里重复一次
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
        # 不要在这里写 try_files：alias 与 try_files $uri 组合会把 /uploads/public/
        # 前缀再拼一次（nginx ticket #97），导致所有公开文件恒 404。
        # alias 对不存在的文件本来就返回 404，无需兜底。
    }

    # 3) 私密目录绝不对外：显式 404，不能落到 SPA（否则会返回一段 HTML）
    location /uploads/private/ {
        return 404;
    }
    location = /uploads/ {
        return 404;
    }

    # 其余 /uploads/ 路径（拼错的文件名、旧 /media/ 之类的遗留地址）一律 404，
    # 别落到 SPA 兜底返回一段 HTML——那会让一个坏掉的图片地址看起来像 200。
    location /uploads/ {
        return 404;
    }

    # 旧方案用过 /media/ 前缀，这里明确 404，别和前端路由混淆
    location /media/ {
        return 404;
    }

    # 4) 站点（其余路径交给前端 SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------- 后台（独立子域名）
server {
    listen 80;
    listen [::]:80;
    server_name admin.entroaxiom.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name admin.entroaxiom.com;

    ssl_certificate     /etc/letsencrypt/live/entroaxiom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entroaxiom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # 独立子域名构建的产物（VITE_PUBLIC_PATH=/），资源引用是 /static/...
    root /srv/entroaxiom/admin;
    index index.html;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # 后台页面不进搜索引擎
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 后台的产物走 /static/ 前缀；index.html 同样每次回源，避免发版后白屏。
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://entroaxiom_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # 后台也要能显示已发布的公开图片：接口返回的是同源相对地址 /uploads/public/...
    # 公开文件本来就是公开的，这里只读提供；私密目录在后台域名同样明确 404。
    # 历史 SVG 直访阻断：旧上传目录里可能还留着 .svg/.svgz，
    # 直接静态提供会被浏览器当成同源文档执行脚本，nosniff 不足以防住。
    # 正则 location 优先级高于前缀 location；只匹配 /uploads/ 下，不影响站点根 favicon.svg。
    location ~* ^/uploads/(public|private)/.+\.svgz?$ {
        return 404;
    }

    location /uploads/public/ {
        alias /srv/entroaxiom/shared/uploads/public/;
        autoindex off;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
        # 不要在这里写 try_files：alias 与 try_files $uri 组合会把 /uploads/public/
        # 前缀再拼一次（nginx ticket #97），导致所有公开文件恒 404。
        # alias 对不存在的文件本来就返回 404，无需兜底。
    }

    location /uploads/private/ {
        return 404;
    }
    location = /uploads/ {
        return 404;
    }

    # 其余 /uploads/ 路径（拼错的文件名、旧 /media/ 之类的遗留地址）一律 404，
    # 别落到 SPA 兜底返回一段 HTML——那会让一个坏掉的图片地址看起来像 200。
    location /uploads/ {
        return 404;
    }

    # 旧方案用过 /media/ 前缀，这里明确 404，别和前端路由混淆
    location /media/ {
        return 404;
    }

    # 前端用 hash 路由，任何深链接都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
