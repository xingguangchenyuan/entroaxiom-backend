# 用法（在 deploy/ 目录）：
#   cp .env.example .env && 编辑 .env
#   docker compose up -d --build
# 目录约定（相对本文件）：../data  ../uploads 在宿主机上，容器重建不会丢数据。

services:
  backend:
    build:
      context: ..
    image: entroaxiom-backend:latest
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    # 只在 compose 内部网络开放，不映射到宿主机端口：外界只能经 Nginx 访问
    expose:
      - "8000"
    volumes:
      - ../data:/app/data
      - ../uploads:/app/uploads        # 后端可读写 public/ 与 private/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}   # 日志轮转：最多 50MB

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${FRONTEND_DIST:-../../entroaxiom-site/dist}:/usr/share/nginx/html:ro
      # 只挂载 public/：Nginx 看不到 private/，私密文件在物理上就无法被静态提供
      - ../uploads/public:/srv/uploads/public:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
